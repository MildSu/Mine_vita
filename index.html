<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef7ef" />
  <meta name="description" content="Mine Vita — private habit, food and mood tracker." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Mine Vita</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">Mine Vita <span aria-hidden="true">🌿</span></div>
        <div id="pageSubtitle" class="subtitle">Your day, at a glance</div>
      </div>
      <button id="installBtn" class="ghost-btn hidden" type="button">Install</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="today" class="nav-item active"><span>⌂</span><small>Today</small></button>
      <button data-tab="habits" class="nav-item"><span>✓</span><small>Habits</small></button>
      <button data-tab="food" class="nav-item"><span>🍎</span><small>Food</small></button>
      <button data-tab="mood" class="nav-item"><span>☺</span><small>Mood</small></button>
      <button data-tab="progress" class="nav-item"><span>▥</span><small>Progress</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="./app.js" defer></script>
</body>
</html>
